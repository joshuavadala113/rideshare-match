<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Rideshare Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main class="single">
    <section class="card">
      <h2>Create your account</h2>
      <p>Use your school or work email so other riders know you're real.</p>

      <form id="signupForm" novalidate>
        <label for="name">Full name</label>
        <input id="name" autocomplete="name" placeholder="Your full name">

        <label for="email">School or work email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@my.unt.edu">

        <label for="role">I am a</label>
        <select id="role">
          <option value="student">Student</option>
          <option value="coworker">Coworker</option>
        </select>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">

        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" placeholder="Type it again">

        <button type="submit">Sign Up</button>
      </form>

      <p id="message" class="error" role="status"></p>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="storage.js"></script>
  <script src="layout.js"></script>
  <script src="signup.js"></script>
</body>
</html>
