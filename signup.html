<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - RideShare Match</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main class="single">
    <section class="card">
      <h2>Join your commute network</h2>
      <p class="fine">Connect and share rides exclusively with verified campus and workplace peers.</p>

      <form id="signupForm" novalidate>
        <label for="name">Full legal name</label>
        <input id="name" autocomplete="name" placeholder="Your full name">

        <div class="label-row">
          <label for="email">Institutional / work email</label>
          <span id="emailTag" class="tag"></span>
        </div>
        <input id="email" type="email" autocomplete="email" placeholder="you@my.unt.edu">

        <label>Campus or workspace</label>
        <div class="chips" id="campusChips">
          <button type="button" class="chip selected" data-value="UNT">UNT</button>
          <button type="button" class="chip" data-value="UT Dallas">UT Dallas</button>
          <button type="button" class="chip" data-value="SMU">SMU</button>
          <button type="button" class="chip" data-value="Dallas College">Dallas College</button>
          <button type="button" class="chip" data-value="Workplace">Workplace</button>
        </div>

        <div class="label-row">
          <label for="password">Create password</label>
          <span id="passTag" class="tag"></span>
        </div>
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
          <button type="button" class="toggle" data-target="password">Show</button>
        </div>

        <label for="confirm">Confirm password</label>
        <div class="password-wrap">
          <input id="confirm" type="password" autocomplete="new-password" placeholder="Type it again">
          <button type="button" class="toggle" data-target="confirm">Show</button>
        </div>

        <label>I plan to</label>
        <div class="segmented" id="planChoice">
          <button type="button" class="seg" data-value="driver">Driver</button>
          <button type="button" class="seg" data-value="rider">Rider</button>
          <button type="button" class="seg selected" data-value="both">Both</button>
        </div>

        <div class="checkbox-row">
          <input id="terms" type="checkbox">
          <label for="terms" style="margin:0;font-weight:400">I agree to the terms and confirm non-commercial carpooling rules.</label>
        </div>

        <button type="submit">Create Account</button>
      </form>

      <p id="message" class="error" role="status"></p>
      <p class="fine center">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="storage.js"></script>
  <script src="layout.js"></script>
  <script src="signup.js"></script>
</body>
</html>
