<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - RideShare Match</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main class="phone">
    <div class="label-row">
      <span class="eyebrow"><i class="dot blue"></i> ADMIN</span>
      <span class="pill" style="margin:0">Class demo</span>
    </div>

    <h3>Counts</h3>
    <div class="stats" id="stats"></div>

    <h3>Reports</h3>
    <div class="segmented two" id="reportTabs">
      <button type="button" class="seg selected" data-v="open">Open</button>
      <button type="button" class="seg" data-v="done">Handled</button>
    </div>
    <div id="reports"></div>

    <h3>Vehicle checks</h3>
    <div id="vehicles"></div>

    <h3>Support tickets</h3>
    <div id="tickets"></div>

    <h3>Decision log</h3>
    <div id="log"></div>

    <h3>People</h3>
    <input type="search" id="find" placeholder="Search by name or email" aria-label="Search people">
    <div id="people"></div>
  </main>

  <footer id="siteFooter"></footer>

  <!-- Every admin action asks for a reason first (FR-11, FR-12) -->
  <div class="sheet hidden" id="reasonSheet" role="dialog" aria-label="Reason for this action">
    <div class="sheet-body">
      <h3 style="margin:0" id="reasonTitle">Reason</h3>
      <p class="fine" id="reasonSub"></p>
      <label for="reasonText">Reason (saved in the decision log)</label>
      <textarea id="reasonText" rows="3" placeholder="Write at least 5 characters"></textarea>
      <p class="fine" id="reasonNote" style="color:#c0392b"></p>
      <div class="actions">
        <button type="button" class="grow" id="reasonOk">Confirm</button>
        <button type="button" class="btn-soft" id="reasonCancel" style="width:auto;padding:14px 18px">Cancel</button>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="layout.js"></script>
  <script src="demo-data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
